<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button> <!-- Botón de retroceso -->
    </ion-buttons>
    <ion-title>Consejos</ion-title> <!-- Título centrado -->
  </ion-toolbar>
</ion-header>

<!-- Sección de Consejos -->
<div class="advice-section">
  <div class="header-row">
    <h2>Acá podrás encontrar tips y consejos para ayudar a tu día a día.</h2>
  </div>
</div>

<ion-content>
  <ion-grid>
    <ion-row>
      <!-- Tarjeta de Enfermedad Renal -->
      <ion-col size="12" size-md="6">
        <ion-card class="enfermedad-renal">
          <ion-card-header>
            <ion-card-title>Enfermedad Renal</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>Descubre consejos prácticos para cuidar tus riñones.</p>
            <ion-button expand="block" routerLink="/tips-enf-renal">Ver Más</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Tarjeta de Hipotiroidismo -->
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Hipotiroidismo</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>Aprende a manejar el hipotiroidismo con una alimentación adecuada.</p>
            <ion-button expand="block" routerLink="/tips-hipotiroidismo">Ver Más</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
